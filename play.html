<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mg Waing &amp; Pat Waing Echo</title>
<style>
  :root {
    --lacquer: #1a0d0a;
    --gold: #d9a441;
    --text: #f2e3c8;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--lacquer);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 12px 20px;
    border-bottom: 1px solid rgba(217,164,65,0.3);
    flex: none;
  }

  header h1 {
    margin: 0;
    font-size: 1rem;
    letter-spacing: 2px;
    color: var(--gold);
  }

  header p {
    margin: 4px 0 0;
    font-size: 0.78rem;
    opacity: 0.6;
  }

  /* The game sits in an iframe and gets the whole page. The Botpress panel
     starts closed, so there is no need to reserve a gap for it. */
  .game-pane {
    flex: 1;
    min-height: 0;
    width: 100%;
  }

  .game-pane iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  #toast {
    position: fixed;
    left: 20px;
    bottom: 20px;
    max-width: 320px;
    padding: 12px 16px;
    border: 1px solid var(--gold);
    border-radius: 8px;
    background: rgba(26,13,10,0.95);
    font-size: 0.85rem;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
  }

  #toast.show { opacity: 1; transform: translateY(0); }

  /* The webchat is loaded only so it can hand the score to Mg Waing. Nothing
     of it should be visible - no bubble, no panel. This is the outer container
     the inject script appends to <body>; everything else lives in a shadow
     root inside it, so hiding this hides the lot. */
  .bpChatContainer { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>MG WAING</h1>
  <p>Play the drum circle. Your score goes to Mg Waing when a run ends.</p>
</header>

<div class="game-pane">
  <iframe src="index.html" title="Pat Waing Echo"></iframe>
</div>

<div id="toast" role="status"></div>

<script src="https://cdn.botpress.cloud/webchat/v3.7/inject.js"></script>
<script>
// ---------------------------------------------------------------------------
// Puts the Mg Waing webchat on the same page as the game and lets them talk.
//
// The game runs in the iframe and posts its result out with postMessage when a
// run ends. We catch it here and send it into the chat as if the player had
// typed it, so Mg Waing reacts to the score.
//
// The webchat is completely hidden (see .bpChatContainer in the CSS). It is
// here for one reason only: it is the only thing that can write the score back
// to Mg Waing. The player talks to him on the chat page, not on this one.
// ---------------------------------------------------------------------------

const CLIENT_ID = '208dcc68-b35f-49e0-aa13-8a205301e89b';

let pending = null;   // a result that could not be delivered yet

// Retry once the webchat announces itself. Note we do NOT gate the first
// attempt on this event: it only fires reliably after the panel is opened, and
// the panel now stays closed, so waiting for it would drop the score entirely.
window.botpress.on('webchat:ready', function () {
  if (pending) {
    const result = pending;
    pending = null;
    sendResult(result);
  }
});

window.botpress.init({
  clientId: CLIENT_ID,
  configuration: {
    botName: 'Mg Waing',
    color: '#8c2f22',
    variant: 'solid',
    themeMode: 'light',
    radius: 4
  }
});

function sendResult(result) {
  // The score goes onto the Botpress user record, where the workflow reads it
  // as user.gameScore and user.gameRound.
  //
  // Deliberately NOT sent as a chat message. Mg Waing spends most of its time
  // parked on a Single Choice card ("What would you like to know about Pat
  // Waing"), and a choice card rejects free text - posting the score there just
  // produces "The response could not be captured. Please try again."
  // updateUser is silent, so it can never collide with whatever the bot is
  // waiting for. The build guide has the menu option that reads it back out.
  try {
    // sendEvent is what actually reaches the workflow. A Custom Trigger in the
    // Main flow filters on type === 'patwaingScore' and copies the numbers into
    // the user variables. updateUser is NOT used for this: the webchat stores
    // that data somewhere the workflow's `user` object cannot see - verified by
    // dumping JSON.stringify(user) inside an Execute Code card, which showed
    // only the declared variables, still at 0.
    window.botpress.sendEvent({
      type: 'patwaingScore',
      score: result.score,
      round: result.round
    });
  } catch (e) {
    pending = result;   // webchat not up yet; the ready handler will retry
    return;
  }

  // Deliberately no open() here either - the toast is enough of a nudge, and
  // throwing the panel over the drum circle mid-game is jarring.
  toast('Score sent to Mg Waing - open the chat and ask how you did.');
}

function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 6000);
}

window.addEventListener('message', function (event) {
  // Only listen to our own game frame, and only to the message we expect.
  if (event.origin !== window.location.origin) return;
  if (!event.data || event.data.type !== 'patwaing:gameover') return;

  sendResult(event.data);
});
</script>

</body>
</html>
